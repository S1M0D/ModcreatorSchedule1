<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob:; worker-src 'none'">
  <title>Model preview</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #202124; color: #e5e5e5; font: 13px 'Segoe UI', sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #toolbar { position: absolute; top: 16px; left: 16px; display: flex; align-items: center; gap: 10px; }
    button { background: #303236; color: #eee; border: 1px solid #65666a; border-radius: 4px; padding: 7px 12px; cursor: pointer; }
    button:focus-visible { outline: 2px solid #efa957; }
    #status { position: absolute; bottom: 16px; left: 16px; right: 16px; background: #202124db; padding: 9px; pointer-events: none; }
  </style>
</head>
<body>
  <canvas aria-label="Interactive GLB model preview"></canvas>
  <div id="toolbar"><button id="frame">Frame model</button><button id="wireframe" aria-pressed="false">Wireframe</button><span>Drag to orbit · Scroll to zoom · Right-drag to pan</span></div>
  <div id="status" role="status">Loading model…</div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
